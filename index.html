<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#0f4034;--felt2:#0a2c23;--panel:#0d3a2f;--line:rgba(200,164,92,.22);
    --soft:rgba(243,235,216,.08);--brass:#c8a45c;--brass-hi:#e6ca8b;
    --bone:#f3ebd8;--dim:#a9b3a5;--win:#5fd39a;--loss:#e0736b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Assistant',system-ui,sans-serif;color:var(--bone);min-height:100dvh;
    background:radial-gradient(130% 80% at 50% -10%,#17513f,var(--felt) 45%,var(--felt2));-webkit-font-smoothing:antialiased}
  .num{font-family:'Heebo';font-variant-numeric:tabular-nums}
  .wrap{max-width:480px;margin:0 auto;padding:16px 14px 34px}

  header{display:flex;align-items:baseline;gap:9px;padding:6px 2px 14px}
  header h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:28px;margin:0;
    background:linear-gradient(180deg,var(--brass-hi),var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent}
  header span{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700}

  .pot{background:linear-gradient(180deg,var(--panel),#0a2f26);border:1px solid var(--line);
    border-radius:18px;padding:15px 16px;margin-bottom:14px;position:relative;overflow:hidden}
  .pot::after{content:'';position:absolute;top:-38px;left:-26px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,164,92,.15),transparent 70%)}
  .pot .lab{font-size:11px;letter-spacing:2px;color:var(--brass);font-weight:700}
  .pot .big{font-family:'Heebo';font-weight:900;font-size:40px;line-height:1.05;margin:3px 0}
  .st{font-size:13px;color:var(--dim);font-weight:600;margin-top:2px}
  .st.ok{color:var(--win);font-weight:700} .st.bad{color:var(--loss);font-weight:700}

  /* quick-pick faces */
  .pick{display:flex;gap:13px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:2px}
  .pick::-webkit-scrollbar{height:0}
  .face{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;flex:0 0 auto;font-family:inherit}
  .face .fimg{width:50px;height:50px;border-radius:50%;overflow:hidden;border:2px solid var(--brass);box-shadow:0 2px 7px -2px rgba(0,0,0,.55)}
  .face .fimg img{width:100%;height:100%;object-fit:cover}
  .face .fimg .ftxt{width:100%;height:100%;display:grid;place-items:center;font-family:'Heebo';font-weight:800;font-size:20px;color:#fff}
  .face small{font-size:11px;color:var(--bone);font-weight:600;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .face.used{opacity:.32}
  .face:active{transform:scale(.94)}

  .row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--soft);
    border-radius:14px;padding:10px 11px;margin-bottom:8px}
  .row.empty{background:rgba(13,58,47,.45);border:1.5px dashed var(--line)}
  .row.counted{background:transparent;border-style:dashed;border-color:var(--line)}

  .chip{position:relative;width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:none;cursor:pointer;

  .chk{position:absolute;z-index:3;bottom:-3px;left:-3px;width:19px;height:19px;border-radius:50%;
    background:var(--win);color:#08251c;font-size:11px;font-weight:900;display:none;place-items:center;
    border:2.5px solid var(--felt2)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}

  .l2{display:flex;align-items:center;gap:8px}

  .exit{margin-inline-start:auto;display:flex;align-items:center;gap:5px;
    background:var(--felt2);border:1px solid var(--line);border-radius:10px;padding:3px 9px}
  .exit:focus-within{border-color:var(--brass)}
  .xl{font-size:12px;color:var(--dim);font-weight:700}
  .xin{width:60px;background:none;border:none;color:var(--bone);font-family:'Heebo';font-weight:800;
    font-size:16px;text-align:center;outline:none;padding:5px 0}

  .settle{margin-top:16px}

  .txv{font-family:'Heebo';font-weight:900;font-size:15px;color:var(--brass-hi)}

const fmt = n => (Math.round(n*100)/100).toLocaleString('he-IL') + ' ₪';

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const jsq = s => esc(JSON.stringify(String(s)));   // safe string literal inside onclick="..."
const LS = {
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fdate = iso => { const [y,m,d]=iso.split('-'); return `${+d}.${+m}.${y.slice(2)}`; };
const dayLabel = iso => new Date(iso+'T12:00').toLocaleDateString('he-IL',{weekday:'long'}) + ' · ' + fdate(iso);
const sgn = n => n>0.005?`+${fmt(n)}`:n<-0.005?`−${fmt(-n)}`:fmt(0);
const sgp = n => { const r=Math.round(n*10)/10; return r>0?`+${r}`:r<0?`−${-r}`:'0'; };
const cls = n => n>0.005?'get':n<-0.005?'pay':'even';

/* ================= data layer ================= */
let DATA = {games:{}, pin:null};
let CLOUD=false, ONLINE=null, everOnline=false, slow=false, loaded=false, loadErr=null, rootRef=null, pending=false;
let tab = LS.get('kupa_tab','next');
let me  = LS.get('kupa_me',null);
let adminForm=false, pickMe=false;

function norm(v){
  const d=v||{}, games={};
  Object.entries(d.games||{}).forEach(([id,g])=>{
    if(!g) return;
    games[id]={...g, id, buyIn:g.buyIn||50, rsvp:g.rsvp||{},
      result: g.result && g.result.players ? {...g.result, players:Object.values(g.result.players)} : null};
  });
  return {games, pin:d.pin||null};
}
function persistLocal(){ LS.set('kupa_data',{games:DATA.games,pin:DATA.pin}); }
function dbSet(path,val){
  if(CLOUD) return rootRef.child(path).set(val==null?null:val);
  const parts=path.split('/'); let o=DATA;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]]||(o[parts[i]]={});
  const last=parts[parts.length-1];
  if(val==null) delete o[last]; else o[last]=JSON.parse(JSON.stringify(val));
  DATA=norm(DATA); persistLocal(); render(); return Promise.resolve();
}
function dbMergeGames(obj){
  if(CLOUD) return rootRef.child('games').update(obj);
  Object.assign(DATA.games, JSON.parse(JSON.stringify(obj))); DATA=norm(DATA); persistLocal(); render(); return Promise.resolve();
}
function loadScript(src){ return new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=bad; document.head.appendChild(s); }); }
function initData(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL){
    CLOUD=true;
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    loadScript(V+'firebase-app-compat.js').then(()=>loadScript(V+'firebase-database-compat.js')).then(()=>{
      firebase.initializeApp(FIREBASE_CONFIG);
      const db=firebase.database(); rootRef=db.ref('kupa');
      db.ref('.info/connected').on('value',s=>{ ONLINE=!!s.val(); if(ONLINE) everOnline=true; softRender(); });
      setTimeout(()=>{ slow=true; softRender(); },10000);
      rootRef.on('value', s=>{ DATA=norm(s.val()); loaded=true; loadErr=null; softRender(); },
                          e=>{ loadErr='השרת סירב: '+(e&&e.message||'') ; softRender(); });
    }).catch(()=>{ loadErr='לא הצלחתי להתחבר לשרת. בדקו חיבור לאינטרנט.'; softRender(); });
  } else {
    let d=LS.get('kupa_data',null);
    if(!d){ // migrate v1 local history
      d={games:{}};
      LS.get('kupa_hist',[]).forEach(r=>{ d.games['g'+r.id]={date:r.date,time:'',place:'',buyIn:r.buyIn||50,created:r.id,
        result:{players:r.players,savedAt:r.id}}; });
    }
    DATA=norm(d); loaded=true;
  }
}

/* ================= PIN ================= */
async function sha(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kupa:'+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function requirePin(){
  if(!CLOUD) return true;

/* ================= games / scoring ================= */
const gamesArr = () => Object.values(DATA.games);
const played   = () => gamesArr().filter(g=>g.result&&g.result.players.length)
  .sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.result.savedAt||0)-(b.result.savedAt||0));
const upcoming = () => gamesArr().filter(g=>!g.result && g.date>=todayISO())
  .sort((a,b)=> (a.date+(a.time||'')) < (b.date+(b.time||'')) ? -1 : 1);
const rsvpList = g => Object.values(g.rsvp||{}).filter(r=>r&&r.name).sort((a,b)=>(a.at||0)-(b.at||0));

function entriesOf(p,buyIn){ return Math.max(1, Math.round(p.in/(buyIn||50))); }
/* "who finished best" = profit per entry, so a 1-entry winner beats a 6-rebuy winner */
function effOf(p,buyIn){ return (p.out-p.in)/entriesOf(p,buyIn); }
function nightScores(g){
  const ps=g.result.players.map(p=>({...p, net:p.out-p.in, e:entriesOf(p,g.buyIn), eff:effOf(p,g.buyIn)}));
  const winners=ps.filter(p=>p.net>0.005);
  const top=winners.length?Math.max(...winners.map(p=>p.eff)):null;
  ps.forEach(p=>{ p.pts = p.net<=0.005 ? 0 : (Math.abs(p.eff-top)<0.005 ? PTS_BEST : PTS_PROFIT); });
  return ps.sort((a,b)=>b.pts-a.pts || b.eff-a.eff);
}
function aggregate(){
  const m={};
  played().forEach(g=>nightScores(g).forEach(p=>{
    const a=m[p.name]||(m[p.name]={name:p.name,pts:0,net:0,in:0,nights:0,wins:0,titles:0,entries:0,cum:[]});
    a.pts+=p.pts; a.net+=p.net; a.in+=p.in; a.nights++; a.entries+=p.e;
    if(p.net>0.005) a.wins++; if(p.pts===PTS_BEST) a.titles++; a.cum.push(a.pts);
  }));
  return Object.values(m).sort((a,b)=>b.pts-a.pts || b.net-a.net);
}

function avatarFor(name){

}

function statusHTML(){

  const g = se - tIn();
  if(Math.abs(g)<0.005) return `<div class="st ok" id="potsub">✓ מאוזן — אין כסף חסר</div>`;
  return `<div class="st bad" id="potsub">${g<0?'חסרים':'עודף של'} ${fmt(Math.abs(g))} — כדאי לספור שוב</div>`;

  return { t: r>0?`+${fmt(r)}` : r<0?`−${fmt(-r)}` : 'תיקו', c: 'net '+(r>0?'get':r<0?'pay':'even') };

function settlements(){
  const nets = named().map(p=>({name:p.name,emoji:p.emoji,color:p.color,photo:photoFor(p),net:p.cashOut-p.buyIn}));
  const cr = nets.filter(x=>x.net>0.005).map(x=>({...x})).sort((a,b)=>b.net-a.net);
  const db = nets.filter(x=>x.net<-0.005).map(x=>({...x,net:-x.net})).sort((a,b)=>b.net-a.net);
  const tx=[]; let i=0,j=0;
  while(i<db.length && j<cr.length){
    const amt=Math.min(db[i].net, cr[j].net);
    tx.push({from:db[i], to:cr[j], amt}); db[i].net-=amt; cr[j].net-=amt;
    if(db[i].net<0.005) i++; if(cr[j].net<0.005) j++;
  }
  return tx;
}

/* ================= board tab ================= */
function sparkSVG(cum){
  const pts=[0,...cum], W=70, Hh=30, pad=3, hi=Math.max(...pts,1);
  const x=i=>pad+(W-2*pad)*(pts.length===1?0:i/(pts.length-1)), y=v=>Hh-pad-(Hh-2*pad)*(v/hi);
  const last=pts[pts.length-1], col=last>0?'var(--win)':'var(--dim)';
  const d=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" aria-label="נקודות מצטברות לאורך זמן">
    <line x1="${pad}" x2="${W-pad}" y1="${Hh-pad}" y2="${Hh-pad}" stroke="var(--dim)" stroke-opacity=".4" stroke-dasharray="2 3"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last)}" r="3" fill="${col}"/></svg>`;
}

  const top=ag[0], low=ag[ag.length-1], mx=Math.max(...ag.map(a=>a.pts),1);

  const rows = ag.map((a,i)=>{

  const nights=[...P].reverse().map(g=>{

    <p>🏆 <b>המנצח של הערב — ${PTS_BEST} נקודות.</b> המנצח הוא מי שהרוויח הכי הרבה <b>ביחס למספר הכניסות שלו</b> (רווח ÷ כניסות).</p>
    <p>✅ <b>כל מי שסיים ברווח — ${PTS_PROFIT} נקודה.</b></p>
    <p>❌ <b>סיים בהפסד או בתיקו — 0.</b></p>
    <p>דוגמה: טל נכנס פעם אחת ויצא עם +100 (100 לכניסה) ← 3 נק׳. יובל עשה 6 כניסות ויצא עם +150 (25 לכניסה) ← 1 נק׳. צ'אגי הפסיד ← 0.</p>
    <p>בשוויון נקודות בטבלה — מי שהרוויח יותר כסף מדורג גבוה יותר.</p>
  </details>`;
}
function backupHTML(){
  return `<div class="bk">
      <button onclick="exportH()">⬇️ גיבוי</button>
      <label>⬆️ טעינת גיבוי<input type="file" accept=".json,application/json" hidden onchange="importH(this.files[0])"></label>
    </div>`;
}

/* ================= render ================= */
function softRender(){
  const a=document.activeElement;
  if(a && $('app').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ pending=true; return; }
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(pending){ pending=false; softRender(); } },50));

function render(){
  let st;
  if(!CLOUD) st=['','מקומי'];
  else if(loadErr) st=['off','שגיאה'];
  else if(loaded && ONLINE!==false) st=['on','מסונכרן'];
  else if(loaded && ONLINE===false) st=['off', everOnline?'אין אינטרנט':'לא מחובר'];
  else st=[slow?'off':'', slow?'לא מצליח להתחבר':'מתחבר…'];
  const cloud = `<button class="cloud ${st[0]}" onclick="connInfo()" style="background:none;border:none;font-family:inherit;cursor:pointer"><i></i>${st[1]}</button>`;
  const body = tab==='kupa' ? kupaHTML() : tab==='board' ? boardHTML() : nextHTML();
  $('app').innerHTML = `<header><h1>הקופה</h1><span>פוקר ביתי</span>${cloud}</header>${body}`;
  $('tabs').innerHTML = `<div>
    <button class="${tab==='next'?'on':''}" onclick="go('next')"><span>📅</span>ערב הבא</button>
    <button class="${tab==='kupa'?'on':''}" onclick="go('kupa')"><span>🧮</span>קופה</button>
    <button class="${tab==='board'?'on':''}" onclick="go('board')"><span>🏆</span>טבלה</button></div>`;
}
function connInfo(){
  alert(['מצב חיבור:', 'שרת: '+(CLOUD?'Firebase':'מקומי בלבד'), 'ספריית Firebase נטענה: '+(typeof firebase!=='undefined'?'כן':'לא'),
    'נתונים התקבלו: '+(loaded?'כן':'לא'), 'חיבור חי: '+(ONLINE===null?'עוד לא ידוע':ONLINE?'כן':'לא'),
    'ערבים בשרת: '+Object.keys(DATA.games).length, loadErr?('שגיאה: '+loadErr):''].filter(Boolean).join('\n'));
}
function go(t){ tab=t; LS.set('kupa_tab',t); adminForm=false; render(); window.scrollTo(0,0); }

/* ================= actions: calculator ================= */
function rename(i,v){
  const p=S.players[i], was=p.name.trim()!=='', now=v.trim();
  p.name=now; applyRoster(p);
  if(!was && now!==''){ p.buyIn=S.buyIn; p.cashOut=null; }
  else if(was && now===''){ p.buyIn=S.buyIn; p.cashOut=null; }
  save(); render();
}
function onExit(i,val){
  const v=val.trim();
  S.players[i].cashOut = v==='' ? null : (parseFloat(v)||0);
  save(); updateNet(i); updatePot(); updateSettle();
}
function rebuy(i){ S.players[i].buyIn += S.buyIn; save(); render(); }
function cycle(i){ const p=S.players[i]; if(photoFor(p)) return; p.emoji=EMO[(EMO.indexOf(p.emoji)+1)%EMO.length]; save(); render(); }
function setBuyIn(v){ const n=parseInt(v); if(n>0) S.buyIn=n; save(); render(); }
function unsavedWork(){ return named().length>=2 && !isSaved(); }
function resetGame(){
  if(confirm(unsavedWork() ? 'הערב הזה עוד לא נשמר בטבלה!\nלהתחיל משחק חדש בכל זאת?' : 'להתחיל משחק חדש? ערבים שמורים נשארים בטבלה.')){
    S=fresh(S.buyIn); save(); render();
  }
}
function unlinkGame(){ S.gameId=null; save(); render(); }
async function saveNight(){
  if(!balanced()) return;
  if(!await requirePin()) return;
  const g=linkedGame(), el=$('gdate'), d=(el&&el.value)||todayISO();
  const id=S.gameId||('g'+Date.now());
  const rec={ date:d, time:(g&&g.time)||'', place:(g&&g.place)||'', buyIn:S.buyIn,
    rsvp:(g&&g.rsvp)||null, created:(g&&g.created)||Date.now(),
    result:{ players: named().map(p=>({name:p.name.trim(), in:p.buyIn, out:p.cashOut})), savedAt:Date.now() } };
  S.gameId=id; S.date=d; save();
  try{ await dbSet('games/'+id, rec); }catch(e){ alert('השמירה נכשלה: '+e.message); }
  render();
}

/* ================= actions: next game ================= */
function setMe(n){ me=n; pickMe=false; LS.set('kupa_me',n); render(); }
function setMeOther(){ const n=prompt('מה השם שלך?'); if(n&&n.trim()) setMe(n.trim().slice(0,16)); }
function toggleRsvp(id){
  const g=DATA.games[id]; if(!g||!me) return;
  const k=key(me);
  dbSet(`games/${id}/rsvp/${k}`, g.rsvp[k] ? null : {name:me, at:Date.now()});
}
async function openForm(){ if(!await requirePin()) return; adminForm=true; render(); }
function createGame(){
  const d=$('gfDate').value, t=$('gfTime').value, pl=$('gfPlace').value.trim();
  if(!d) return alert('בחרו תאריך');
  const id='g'+Date.now();
  adminForm=false;
  dbSet('games/'+id,{date:d,time:t,place:pl,buyIn:S.buyIn,created:Date.now()});
  render();
}
async function deleteGame(id){
  const g=DATA.games[id]; if(!g) return;
  if(!await requirePin()) return;
  if(!confirm(`למחוק את הערב של ${fdate(g.date)}?${g.result?'\nהתוצאות שלו ייעלמו מהטבלה.':''}`)) return;
  if(S.gameId===id){ S.gameId=null; save(); }
  dbSet('games/'+id,null);
}
function shareGame(id){
  const g=DATA.games[id]; if(!g) return;
  const list=rsvpList(g).map(r=>r.name);
  const url=location.href.split('#')[0].split('?')[0];
  const txt=`🃏 ערב פוקר — ${dayLabel(g.date)}${g.time?' ב-'+g.time:''}${g.place?'\n📍 '+g.place:''}\n💰 כניסה ${g.buyIn} ₪`
    + (list.length?`\n✋ באים (${list.length}): ${list.join(', ')}`:'') + `\n\nנרשמים כאן 👇\n${url}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function openKupa(id){
  const g=DATA.games[id]; if(!g) return;
  if(S.gameId!==id && unsavedWork() && !confirm('בקופה יש ערב שלא נשמר. לפתוח קופה חדשה לערב הזה?')) return;
  if(S.gameId!==id){
    S=fresh(g.buyIn||S.buyIn); S.gameId=id;
    rsvpList(g).slice(0,11).forEach((r,i)=>{ S.players[i].name=r.name; applyRoster(S.players[i]); });
    save();
  }
  go('kupa');
}

/* ================= backup ================= */
async function exportH(){
  const txt=JSON.stringify({app:'kupa',v:2,games:DATA.games},null,1);
  const name=`poker-backup-${todayISO()}.json`;
  try{
    const f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'גיבוי פוקר'}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=name; a.click();
}
async function importH(file){
  if(!file) return;
  let obj={};
  try{
    const d=JSON.parse(await file.text());
    if(d && d.games) Object.entries(d.games).forEach(([id,g])=>{ if(g&&g.date){ const c={...g}; delete c.id; obj[id]=c; } });
    else (Array.isArray(d)?d:(d&&d.nights)||[]).forEach(r=>{ if(r&&r.id&&r.date&&Array.isArray(r.players))
      obj['g'+r.id]={date:r.date,time:'',place:'',buyIn:r.buyIn||50,created:r.id,result:{players:r.players,savedAt:r.id}}; });
  }catch(e){ return alert('הקובץ לא תקין'); }
  Object.keys(obj).forEach(id=>{ if(DATA.games[id]) delete obj[id]; });
  if(!Object.keys(obj).length) return alert('אין בקובץ ערבים חדשים');
  if(!await requirePin()) return;
  await dbMergeGames(obj);
  alert(`נטענו ${Object.keys(obj).length} ערבים`);
}

initData();
render();
</script>
