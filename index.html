<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>הקופה · פוקר ביתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#0f4034;--felt2:#0a2c23;--panel:#0d3a2f;--line:rgba(200,164,92,.22);
    --soft:rgba(243,235,216,.08);--brass:#c8a45c;--brass-hi:#e6ca8b;
    --bone:#f3ebd8;--dim:#a9b3a5;--win:#5fd39a;--loss:#e0736b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Assistant',system-ui,sans-serif;color:var(--bone);min-height:100dvh;
    background:radial-gradient(130% 80% at 50% -10%,#17513f,var(--felt) 45%,var(--felt2));-webkit-font-smoothing:antialiased}
  .num{font-family:'Heebo';font-variant-numeric:tabular-nums}
  .wrap{max-width:480px;margin:0 auto;padding:16px 14px 34px}

  header{display:flex;align-items:baseline;gap:9px;padding:6px 2px 14px}
  header h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:28px;margin:0;
    background:linear-gradient(180deg,var(--brass-hi),var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent}
  header span{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700}

  .pot{background:linear-gradient(180deg,var(--panel),#0a2f26);border:1px solid var(--line);
    border-radius:18px;padding:15px 16px;margin-bottom:14px;position:relative;overflow:hidden}
  .pot::after{content:'';position:absolute;top:-38px;left:-26px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,164,92,.15),transparent 70%)}
  .pot .lab{font-size:11px;letter-spacing:2px;color:var(--brass);font-weight:700}
  .pot .big{font-family:'Heebo';font-weight:900;font-size:40px;line-height:1.05;margin:3px 0}
  .st{font-size:13px;color:var(--dim);font-weight:600;margin-top:2px}
  .st.ok{color:var(--win);font-weight:700} .st.bad{color:var(--loss);font-weight:700}

  /* quick-pick faces */
  .pick{display:flex;gap:13px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:2px}
  .pick::-webkit-scrollbar{height:0}
  .face{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;flex:0 0 auto;font-family:inherit}
  .face .fimg{width:50px;height:50px;border-radius:50%;overflow:hidden;border:2px solid var(--brass);box-shadow:0 2px 7px -2px rgba(0,0,0,.55)}
  .face .fimg img{width:100%;height:100%;object-fit:cover}
  .face small{font-size:11px;color:var(--bone);font-weight:600;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .face.used{opacity:.32}
  .face:active{transform:scale(.94)}

  .row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--soft);
    border-radius:14px;padding:10px 11px;margin-bottom:8px}
  .row.empty{background:rgba(13,58,47,.45);border:1.5px dashed var(--line)}
  .row.counted{background:transparent;border-style:dashed;border-color:var(--line)}

  .chip{position:relative;width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:none;cursor:pointer;
    background:var(--c,#b5322f);display:grid;place-items:center;padding:0;overflow:visible;
    box-shadow:0 3px 7px -2px rgba(0,0,0,.5),inset 0 0 0 2px rgba(0,0,0,.12)}
  .chip::before{content:'';position:absolute;inset:0;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,255,255,.9) 0 11deg,transparent 11deg 30deg);
    -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%)}
  .chip.hasimg::before{opacity:.55}
  .chip::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.5)}
  .chip.hasimg::after{display:none}
  .chip b{position:relative;z-index:1;font-size:19px}
  .chip .pimg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%;object-fit:cover;z-index:1}
  .chip.dim{opacity:.38;cursor:default}
  .chk{position:absolute;z-index:3;bottom:-3px;left:-3px;width:19px;height:19px;border-radius:50%;
    background:var(--win);color:#08251c;font-size:11px;font-weight:900;display:none;place-items:center;
    border:2.5px solid var(--felt2)}
  .row.counted .chk{display:grid}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .l1{display:flex;align-items:baseline;gap:8px}
  .nm{flex:1;min-width:0;background:none;border:none;color:var(--bone);font-family:inherit;
    font-size:16px;font-weight:700;padding:2px 1px;outline:none;border-bottom:1.5px solid transparent}
  .nm:focus{border-bottom-color:var(--brass)}
  .nm::placeholder{color:var(--dim);font-weight:600}
  .net{font-family:'Heebo';font-weight:900;font-size:16px;white-space:nowrap;min-height:19px}
  .net.get{color:var(--win)} .net.pay{color:var(--loss)} .net.even{color:var(--dim);font-weight:700}

  .l2{display:flex;align-items:center;gap:8px}
  .ent{font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
  .rb{border:none;border-radius:9px;padding:7px 10px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
  .rb:active{transform:scale(.92)}
  .rb.buy{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#3a2c0e}
  .exit{margin-inline-start:auto;display:flex;align-items:center;gap:5px;
    background:var(--felt2);border:1px solid var(--line);border-radius:10px;padding:3px 9px}
  .exit:focus-within{border-color:var(--brass)}
  .xl{font-size:12px;color:var(--dim);font-weight:700}
  .xin{width:60px;background:none;border:none;color:var(--bone);font-family:'Heebo';font-weight:800;
    font-size:16px;text-align:center;outline:none;padding:5px 0}
  .xin::placeholder{color:rgba(169,179,165,.5);font-weight:600}
  .cul{font-size:12px;color:var(--dim)}

  .settle{margin-top:16px}
  .scard{background:linear-gradient(180deg,var(--panel),#0a2f26);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
  .stitle{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:17px;margin-bottom:6px}
  .tx{display:flex;align-items:center;gap:7px;padding:10px 2px;border-bottom:1px solid var(--soft);flex-wrap:wrap}
  .tx:last-child{border-bottom:none}
  .party{display:flex;align-items:center;gap:6px}
  .party b{font-weight:700;font-size:14.5px}
  .verb{color:var(--dim);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .txv{font-family:'Heebo';font-weight:900;font-size:15px;color:var(--brass-hi)}
  .mc{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:13px;
    background:var(--c,#b5322f);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);overflow:hidden}
  .mc img{width:100%;height:100%;object-fit:cover}
  .shint{color:var(--dim);font-size:13px;text-align:center;padding:13px;border:1.5px dashed var(--line);border-radius:14px;font-weight:600}
  .shint.bad{color:var(--loss);border-color:rgba(224,115,107,.4)}

  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 4px}
  .foot label{font-size:13px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px}
  .setin{width:52px;background:var(--panel);border:1px solid var(--line);color:var(--bone);
    border-radius:8px;padding:6px;text-align:center;font-family:'Heebo';font-weight:700;font-size:14px;outline:none}
  .reset{background:none;border:none;color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;
    text-decoration:underline;cursor:pointer;padding:6px}
  .reset:active{color:var(--loss)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const fmt = n => (Math.round(n*100)/100).toLocaleString('he-IL') + ' ₪';
const EMO = ['🐺','🦊','🐻','🦁','🐯','🐸','🦉','🐵','🐨','🐷','🐔'];
const COL = ['#b5322f','#2f5fb5','#2f8f57','#8a3fb0','#d08a1e','#3a6ea5','#4a7a4a','#a0432f','#c94f7c','#3f8f8a','#7a6ad0'];

function fresh(buyIn){
  return { buyIn:buyIn||50,
    players: Array.from({length:11},(_,i)=>({name:'',emoji:EMO[i],color:COL[i],photo:null,buyIn:buyIn||50,cashOut:null})) };
}
let S = load(); if(!S || !Array.isArray(S.players) || S.players.length!==11) S = fresh();

function load(){ try{ return JSON.parse(localStorage.getItem('kupa3')); }catch(e){ return null; } }
function save(){ localStorage.setItem('kupa3', JSON.stringify(S)); }

const named   = () => S.players.filter(p=>p.name.trim()!=='');
const tIn     = () => named().reduce((a,p)=>a+p.buyIn,0);
const counted = () => named().filter(p=>p.cashOut!=null);
const sumExit = () => counted().reduce((a,p)=>a+p.cashOut,0);

/* roster helpers */
function rosterPhoto(name){ const n=(name||'').trim(); const r=ROSTER.find(x=>x.name.trim()===n); return r?r.photo:null; }
function photoFor(p){ return p.photo || rosterPhoto(p.name); }
function isUsed(name){ const n=name.trim(); return S.players.some(p=>p.name.trim()===n); }
function addFromRoster(idx){
  const r=ROSTER[idx]; if(isUsed(r.name)) return;
  const slot=S.players.find(p=>p.name.trim()===''); if(!slot) return;
  slot.name=r.name; slot.buyIn=S.buyIn; slot.cashOut=null; save(); render();
}

/* ---- top status ---- */
function statusHTML(){
  const nm=named();
  if(!nm.length) return `<div class="st" id="potsub">בחרו פרצוף למעלה או מלאו שם</div>`;
  const c=counted(), se=sumExit();
  if(c.length < nm.length)
    return `<div class="st" id="potsub">נספרו ${fmt(se)} מתוך ${fmt(tIn())} · ${nm.length-c.length} עוד לא נספרו</div>`;
  const g = se - tIn();
  if(Math.abs(g)<0.005) return `<div class="st ok" id="potsub">✓ מאוזן — אין כסף חסר</div>`;
  return `<div class="st bad" id="potsub">${g<0?'חסרים':'עודף של'} ${fmt(Math.abs(g))} — כדאי לספור שוב</div>`;
}
function updatePot(){ document.getElementById('potsub').outerHTML = statusHTML();
  document.getElementById('potbig').textContent = fmt(tIn()); }

/* ---- per-player net ---- */
function netHTML(p){
  if(p.cashOut==null) return {t:'',c:'net'};
  const r=p.cashOut - p.buyIn;
  return { t: r>0?`+${fmt(r)}` : r<0?`−${fmt(-r)}` : 'תיקו',
           c: 'net '+(r>0?'get':r<0?'pay':'even') };
}
function updateNet(i){
  const p=S.players[i], n=netHTML(p);
  const el=document.getElementById('net'+i); el.textContent=n.t; el.className=n.c;
  document.getElementById('row'+i).classList.toggle('counted', p.cashOut!=null);
}

/* ---- settlement ---- */
function settlements(){
  const nets = named().map(p=>({name:p.name,emoji:p.emoji,color:p.color,photo:photoFor(p),net:p.cashOut-p.buyIn}));
  const cr = nets.filter(x=>x.net>0.005).map(x=>({...x})).sort((a,b)=>b.net-a.net);
  const db = nets.filter(x=>x.net<-0.005).map(x=>({...x,net:-x.net})).sort((a,b)=>b.net-a.net);
  const tx=[]; let i=0,j=0;
  while(i<db.length && j<cr.length){
    const amt=Math.min(db[i].net, cr[j].net);
    tx.push({from:db[i], to:cr[j], amt});
    db[i].net-=amt; cr[j].net-=amt;
    if(db[i].net<0.005) i++;
    if(cr[j].net<0.005) j++;
  }
  return tx;
}
function mc(x){
  return x.photo ? `<span class="mc"><img src="${x.photo}" alt=""></span>`
                 : `<span class="mc" style="--c:${x.color}">${x.emoji}</span>`;
}
function settleHTML(){
  const nm=named();
  if(nm.length<2) return '';
  if(counted().length < nm.length)
    return `<div class="shint">מלאו "יצא עם" לכל השחקנים כדי לראות מי משלם למי</div>`;
  if(Math.abs(sumExit()-tIn())>=0.005)
    return `<div class="shint bad">יש פער בספירה — אזנו את הקופה כדי לחשב סגירה</div>`;
  const tx=settlements();
  if(!tx.length) return `<div class="scard"><div class="stitle">מי משלם למי</div><div class="shint" style="border:none">כולם בתיקו — אין העברות 🎉</div></div>`;
  return `<div class="scard"><div class="stitle">מי משלם למי</div>` + tx.map(t=>`
    <div class="tx">
      <div class="party">${mc(t.from)}<b>${esc(t.from.name)}</b></div>
      <div class="verb">משלם <span class="txv">${fmt(t.amt)}</span> ל־</div>
      <div class="party">${mc(t.to)}<b>${esc(t.to.name)}</b></div>
    </div>`).join('') + `</div>`;
}
function updateSettle(){ document.getElementById('settle').innerHTML = settleHTML(); }

/* ---- rows ---- */
function faceHTML(p){
  const ph=photoFor(p);
  return ph ? `<img class="pimg" src="${ph}" alt="">` : `<b>${p.emoji}</b>`;
}
function slotRow(p,i){
  const ph=photoFor(p);
  if(p.name.trim()===''){
    return `<div class="row empty" id="row${i}">
      <div class="chip dim ${ph?'hasimg':''}" style="--c:${p.color}">${faceHTML(p)}</div>
      <input class="nm" id="nm${i}" placeholder="שחקן ${i+1}" maxlength="16"
        onchange="rename(${i},this.value)" onkeydown="if(event.key==='Enter')this.blur()">
    </div>`;
  }
  const n=netHTML(p);
  return `<div class="row ${p.cashOut!=null?'counted':''}" id="row${i}">
    <button class="chip ${ph?'hasimg':''}" style="--c:${p.color}" onclick="cycle(${i})" aria-label="החלף צ׳יפ">${faceHTML(p)}<i class="chk">✓</i></button>
    <div class="main">
      <div class="l1">
        <input class="nm" id="nm${i}" value="${esc(p.name)}" maxlength="16" onchange="rename(${i},this.value)">
        <div class="${n.c}" id="net${i}">${n.t}</div>
      </div>
      <div class="l2">
        <span class="ent">נכנס ${fmt(p.buyIn)}</span>
        <button class="rb buy" onclick="rebuy(${i})">+${S.buyIn}</button>
        <div class="exit">
          <span class="xl">יצא עם</span>
          <input class="xin" id="ex${i}" inputmode="decimal" placeholder="0"
                 value="${p.cashOut!=null?p.cashOut:''}" oninput="onExit(${i},this.value)">
          <span class="cul">₪</span>
        </div>
      </div>
    </div>
  </div>`;
}

function pickHTML(){
  if(!ROSTER.length) return '';
  return `<div class="pick">${ROSTER.map((r,idx)=>`
    <button class="face ${isUsed(r.name)?'used':''}" onclick="addFromRoster(${idx})">
      <span class="fimg"><img src="${r.photo}" alt=""></span><small>${esc(r.name)}</small>
    </button>`).join('')}</div>`;
}

function render(){
  document.getElementById('app').innerHTML = `
    <header><h1>הקופה</h1><span>פוקר ביתי</span></header>
    <div class="pot">
      <div class="lab">סה״כ בקופה</div>
      <div class="big" id="potbig">${fmt(tIn())}</div>
      ${statusHTML()}
    </div>
    ${pickHTML()}
    ${S.players.map(slotRow).join('')}
    <div class="settle" id="settle">${settleHTML()}</div>
    <div class="foot">
      <label>כניסה / ריביי <input type="number" class="setin num" value="${S.buyIn}" inputmode="numeric" onchange="setBuyIn(this.value)"> ₪</label>
      <button class="reset" onclick="resetGame()">משחק חדש</button>
    </div>`;
}

/* ---- actions ---- */
function rename(i,v){
  const p=S.players[i], was=p.name.trim()!=='', now=v.trim();
  p.name=now;
  if(!was && now!==''){ p.buyIn=S.buyIn; p.cashOut=null; }
  else if(was && now===''){ p.buyIn=S.buyIn; p.cashOut=null; }
  save(); render();
}
function onExit(i,val){
  const v=val.trim();
  S.players[i].cashOut = v==='' ? null : (parseFloat(v)||0);
  save(); updateNet(i); updatePot(); updateSettle();
}
function rebuy(i){ S.players[i].buyIn += S.buyIn; save(); render(); }
function cycle(i){ const p=S.players[i]; if(photoFor(p)) return; p.emoji=EMO[(EMO.indexOf(p.emoji)+1)%EMO.length]; save(); render(); }
function setBuyIn(v){ const n=parseInt(v); if(n>0) S.buyIn=n; save(); render(); }
function resetGame(){ if(confirm('להתחיל משחק חדש? כל הנתונים הנוכחיים יימחקו.')){ S=fresh(S.buyIn); save(); render(); } }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
render();
</script>
</body>
</html>
